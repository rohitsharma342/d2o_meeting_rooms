name: d2o_meeting_rooms
description: A streamlined mobile app for managing meeting room bookings

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  table_calendar: ^3.0.9
  intl: ^0.18.1
  flutter_staggered_animations: ^1.1.1
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.1
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  http: ^1.1.0
  crypto: ^3.0.3
  uuid: ^4.2.1
  file: ^7.0.0
  flutter_keyboard_visibility: ^6.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true